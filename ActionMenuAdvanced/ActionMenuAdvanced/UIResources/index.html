<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Action Menu</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="custom.css">
    <script src="../Common/cohtml.js"></script>
</head>

<body>
    <!-- Buehne: 500x500 Menue, darueber 100px Platz fuer die Ziffernblock-Textbox -->
    <div id="stage">
    <div id="actionmenu">
        <div class="segments"></div>
        <div class="inside"></div>
        <div class="items"></div>
        <div class="joystick"></div>
    </div>

    <div id="widget-radial">
        <div class="arc"></div>
        <div class="inside"></div>
        <div class="center">
        </div>
        <div class="indicator">
            <div class="joystick"></div>
            <div class="value"></div>
        </div>
    </div>

    <div id="widget-j2d">
        <div class="w-header">
            <div class="w-meta"><span class="w-name"></span><span class="w-current"></span></div>
            <div class="w-box"><span class="w-value"></span></div>
        </div>
        <div class="j2d-bg"></div>
        <div class="j2d-axis-x"></div>
        <div class="j2d-axis-y"></div>
        <div class="j2d-ring"></div>
        <div class="j2d-guide-v"></div>
        <div class="j2d-guide-h"></div>
        <div class="triangles"></div>
        <div class="j2d-marker"><div class="j2d-marker-inner"></div></div>
    </div>

    <!-- Debug-Anzeige in den freien Ecken unter dem Hexagon -->
    <div id="debug-footer">
        <div class="debug-left"></div>
        <div class="debug-right">Debugging enabled</div>
    </div>

    <div id="widget-numpad">
        <div class="np-header">
            <div class="np-meta"><span class="np-name"></span><span class="np-range"></span></div>
            <div class="np-box"><div class="np-placeholder"></div><span class="np-text"></span><span class="np-caret"></span></div>
        </div>
        <div class="np-segments"></div>
        <div class="np-labels"></div>
        <div class="np-ok"></div>
        <div class="np-ok-label">OK</div>
        <div class="joystick"></div>
    </div>

    </div>

    <script src="index.js"></script>
    <script src="custom.js"></script>
</body>
</html>
